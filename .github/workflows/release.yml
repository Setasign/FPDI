on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.x.x)'
        required: true

name: Create release

permissions:
  packages: write
  contents: write

jobs:
  build:
    name: Create release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Replace version constant
        run: |
          sed -i "s/VERSION\s*=\s*[^;]*/VERSION = '${NEW_VERSION}'/g" ./src/Fpdi.php ./src/Tcpdf/Fpdi.php ./src/Tfpdf/Fpdi.php
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
      - name: Commit and push version constant update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Updated version constant
          push_options: --force

      - name: Declare actual commit sha
        id: actual_commit_sha
        shell: bash
        run: echo "::set-output name=sha::$(git rev-parse HEAD)"
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target_commitish: ${{ steps.actual_commit_sha.outputs.sha }}
          tag_name: v${{ github.event.inputs.version }}
          name: FPDI ${{ github.event.inputs.version }}
          draft: true